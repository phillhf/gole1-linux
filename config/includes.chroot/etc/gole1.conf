# Gole1 Linux - Geräteeinstellungen
# Benutzer können einzelne Werte in ~/.config/gole1/display.conf überschreiben.

# Bildschirm-Drehung: auto | normal | 90 | 180 | 270
# "auto" dreht ein hochkant gemeldetes Panel automatisch ins Querformat.
# Steht das Bild auf dem Kopf, hier 270 statt 90 eintragen (oder in der
# Leiste auf das Dreh-Symbol tippen - das wird pro Benutzer gespeichert).
ROTATION=auto

# Skalierung der Oberfläche. 5 Zoll mit 1280x720 -> 1.25 ist gut bedienbar.
SCALE=1.25

# Name des Bildschirmausgangs, leer = automatisch (meist DSI-1)
OUTPUT=

# Zusätzliche Kernel-Parameter für das installierte System, z. B.
#   fbcon=rotate:1          Textkonsole beim Booten drehen
#   intel_idle.max_cstate=1 bei sporadischen Einfrierern (alter Cherry-Trail-Bug)
KERNEL_ARGS=""
